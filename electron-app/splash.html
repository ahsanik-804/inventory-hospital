<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent;
    font-family:'Segoe UI', -apple-system, sans-serif;
    overflow:hidden;
    -webkit-app-region: drag;
  }

  .card {
    width:100%; height:100%;
    border-radius:20px;
    background:linear-gradient(160deg,#0B8B7A 0%,#0d9488 45%,#0ea5e9 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    opacity:0; animation: cardIn 0.5s ease-out forwards;
  }

  @keyframes cardIn {
    from { opacity:0; transform:scale(0.96); }
    to   { opacity:1; transform:scale(1); }
  }


  .blob { position:absolute; border-radius:50%; background:rgba(255,255,255,0.08); }
  .blob1 { width:220px; height:220px; top:-80px; right:-60px; }
  .blob2 { width:160px; height:160px; bottom:-50px; left:-40px; background:rgba(255,255,255,0.06); }

  .logo-wrap {
    width:84px; height:84px; border-radius:22px;
    background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    box-shadow:0 0 0 0 rgba(255,255,255,0.25);
    animation: pulseGlow 2.2s ease-in-out infinite;
    position:relative; z-index:2;
  }
  @keyframes pulseGlow {
    0%   { box-shadow:0 0 0 0 rgba(255,255,255,0.22); }
    70%  { box-shadow:0 0 0 18px rgba(255,255,255,0); }
    100% { box-shadow:0 0 0 0 rgba(255,255,255,0); }
  }

  .title {
    color:#fff; font-size:20px; font-weight:800; letter-spacing:0.01em;
    position:relative; z-index:2;
    opacity:0; animation: fadeUp 0.5s ease-out 0.25s forwards;
  }
  .subtitle {
    color:rgba(255,255,255,0.75); font-size:12px; font-weight:500; margin-top:4px;
    position:relative; z-index:2;
    opacity:0; animation: fadeUp 0.5s ease-out 0.35s forwards;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .progress-track {
    width:160px; height:4px; border-radius:4px;
    background:rgba(255,255,255,0.2);
    margin-top:34px; overflow:hidden;
    position:relative; z-index:2;
    opacity:0; animation: fadeUp 0.5s ease-out 0.45s forwards;
  }
  .progress-bar {
    position:absolute; top:0; left:0; height:100%; width:40%;
    border-radius:4px;
    background:#ffffff;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { left:-40%; }
    100% { left:100%; }
  }

  .loading-text {
    color:rgba(255,255,255,0.65); font-size:10.5px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; margin-top:14px;
    position:relative; z-index:2;
    opacity:0; animation: fadeUp 0.5s ease-out 0.5s forwards;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="logo-wrap">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M2 12h20" stroke="white" stroke-width="3.4"/>
      </svg>
    </div>

    <div class="title">Clinic Inventory</div>
    <div class="subtitle">Al Rehmat Hospital &middot; Medical Inventory</div>

    <div class="progress-track"><div class="progress-bar"></div></div>
    <div class="loading-text">Loading your data</div>
  </div>
</body>
</html>
